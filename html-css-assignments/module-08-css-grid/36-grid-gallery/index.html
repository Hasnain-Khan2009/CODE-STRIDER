<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photo gallery built with CSS Grid using fixed row height, column spans, row spans and dense auto-flow.">
  <meta name="author" content="Aarav Sharma">
  <meta name="theme-color" content="#0f766e">
  <title>Photo Gallery — CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Photo gallery</h1><p>Wide and tall tiles share one grid; <code>grid-auto-flow: dense</code> fills the gaps.</p></header>
<main>
  <ul class="gallery">
    <li class="tile wide"><figure><img src="images/photo1.svg" alt="Teal hills with a white sun" width="600" height="400"><figcaption>Photo 1</figcaption></figure></li>
    <li class="tile"><figure><img src="images/photo2.svg" alt="Five white dots on an amber background" width="600" height="400"><figcaption>Photo 2</figcaption></figure></li>
    <li class="tile tall"><figure><img src="images/photo3.svg" alt="Indigo bar graphic with five white columns" width="600" height="400"><figcaption>Photo 3</figcaption></figure></li>
    <li class="tile"><figure><img src="images/photo4.svg" alt="Rose hills under a pale sun" width="600" height="400"><figcaption>Photo 4</figcaption></figure></li>
    <li class="tile"><figure><img src="images/photo5.svg" alt="Slate background with scattered white dots" width="600" height="400"><figcaption>Photo 5</figcaption></figure></li>
    <li class="tile wide"><figure><img src="images/photo6.svg" alt="Green bar graphic of rising columns" width="600" height="400"><figcaption>Photo 6</figcaption></figure></li>
    <li class="tile"><figure><img src="images/photo7.svg" alt="Purple hills with a bright sun" width="600" height="400"><figcaption>Photo 7</figcaption></figure></li>
    <li class="tile"><figure><img src="images/photo8.svg" alt="Orange dots on a warm gradient" width="600" height="400"><figcaption>Photo 8</figcaption></figure></li>
    <li class="tile"><figure><img src="images/photo9.svg" alt="Cyan bar graphic with uneven columns" width="600" height="400"><figcaption>Photo 9</figcaption></figure></li>
  </ul>
</main>
</body>
</html>
