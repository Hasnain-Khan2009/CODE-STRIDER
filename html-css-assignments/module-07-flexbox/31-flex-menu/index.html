<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive navigation menu bar built with display flex, space-between, margin auto and a mobile column layout.">
  <meta name="author" content="Aarav Sharma">
  <meta name="theme-color" content="#0f766e">
  <title>Responsive Menu Bar — Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#">CodeCampus</a>
  <nav aria-label="Main">
    <ul class="menu">
      <li><a href="#" aria-current="page">Home</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Blog</a></li>
      <li class="menu__cta"><a href="#">Sign in</a></li>
    </ul>
  </nav>
</header>
<main class="page"><h1>Flexbox menu bar</h1><p>Resize the window below 640px: the links stack vertically and become full-width tap targets.</p></main>
</body>
</html>
