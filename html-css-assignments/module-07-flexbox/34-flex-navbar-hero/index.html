<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive navbar and hero section for a coding-practice site, built entirely with Flexbox.">
  <meta name="author" content="Aarav Sharma">
  <meta name="theme-color" content="#0f766e">
  <title>LearnLoop — Navbar and Hero (Flexbox)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#">LearnLoop</a>
  <nav aria-label="Main">
    <ul class="nav__links">
      <li><a href="#">Courses</a></li>
      <li><a href="#">Practice</a></li>
      <li><a href="#">Pricing</a></li>
    </ul>
  </nav>
  <a class="btn" href="#">Start free</a>
</header>

<main>
  <section class="hero">
    <div class="hero__text">
      <h1>Learn to code by finishing small projects</h1>
      <p>Short lessons, real exercises and instant feedback. Build a page, a form, then a full site.</p>
      <div class="hero__actions">
        <a class="btn btn--big" href="#">Start your first project</a>
        <a class="btn btn--ghost btn--big" href="#">See the syllabus</a>
      </div>
      <ul class="stats">
        <li><strong>45</strong> practice projects</li>
        <li><strong>9</strong> modules</li>
        <li><strong>0</strong> setup needed</li>
      </ul>
    </div>
    <div class="hero__visual" role="img" aria-label="Illustration of a browser window containing a heading and two content blocks">
      <div class="window"><span></span><span></span><span></span>
        <div class="window__body"><i class="line line--long"></i><i class="line"></i><i class="line line--short"></i><div class="blocks"><b></b><b></b></div></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
